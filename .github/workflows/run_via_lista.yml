name: Baixar RPE 2025 - Via Lista

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Lista de IDs separados por vírgula (ex: 12, 45, 873, 2001)"
        required: true
      download_timeout_ms:
        description: "Timeout (ms) para capturar download por ID"
        required: false
        default: "6500"
      goto_timeout_ms:
        description: "Timeout (ms) do page.goto por ID"
        required: false
        default: "9000"
      request_delay_ms:
        description: "Atraso (ms) entre IDs"
        required: false
        default: "100"

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright

      - name: Install Playwright browser
        run: |
          python -m playwright install --with-deps chromium

      - name: Diagnose Playwright runtime
        run: |
          python -m playwright --version
          python - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  page = await browser.new_page()
                  await page.goto("https://example.com", wait_until="domcontentloaded")
                  print("Playwright OK:", await page.title())
                  await browser.close()

          asyncio.run(main())
          PY

      - name: Run download script
        timeout-minutes: 60
        env:
          IDS: ${{ inputs.ids }}
          DOWNLOAD_TIMEOUT_MS: ${{ inputs.download_timeout_ms }}
          GOTO_TIMEOUT_MS: ${{ inputs.goto_timeout_ms }}
          REQUEST_DELAY_MS: ${{ inputs.request_delay_ms }}
        run: python -u downloader_2025_via_lista.py

      - name: Upload ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: RPE_2025_ZIPs
          path: "*.zip"
